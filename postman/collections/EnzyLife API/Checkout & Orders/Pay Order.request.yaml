$kind: http-request
name: Pay Order
method: POST
url: '{{base_url}}/api/orders/{{pemesanan_id}}/pay'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{auth_token}}'
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
queryParams:
  - key: simulate
    value: 'true'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response body has field 'success' with value true", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property("success");
          pm.expect(jsonData.success).to.eql(true);
      });

      pm.test("Response body has field 'message'", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property("message");
      });

      pm.test("Response body 'message' contains word 'berhasil'", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.message).to.include("berhasil");
      });

      pm.test("Response time is less than 5000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });
