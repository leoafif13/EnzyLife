$kind: http-request
name: Checkout
method: POST
url: '{{base_url}}/api/checkout'
order: 1000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{auth_token}}'
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "items": [
        {
          "produk_id": 1,
          "qty": 1
        }
      ],
      "metode_pembayaran": "COD",
      "jenis_cod": "AMBIL_TEMPAT"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 201 or 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201]);
      });

      pm.test("Response body has field 'success' with value true", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property("success");
          pm.expect(jsonData.success).to.eql(true);
      });

      pm.test("Response body has field 'message'", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property("message");
      });

      pm.test("Response body has field 'pemesanan_id' of type number", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property("pemesanan_id");
          pm.expect(jsonData.pemesanan_id).to.be.a("number");
      });

      pm.test("Save pemesanan_id to collection variable", function () {
          var jsonData = pm.response.json();
          pm.collectionVariables.set("pemesanan_id", jsonData.pemesanan_id);
      });

      pm.test("Response time is less than 5000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });
